# Vendored from omp-voice-kokoro 0.1.0 (crates.io; MIT, Kyle Kelley / Can Boluk, https://github.com/can1357/omp).
# Local changes (see VENDORED.md): CPU BiLSTM with precomputed input projection, gather-based alignment.
[package]
name = "omp-voice-kokoro"
version = "0.1.0-kokoro-reader"
edition = "2024"
license = "MIT"
authors = ["Kyle Kelley", "Can Boluk"]
description = "Kokoro-82M text-to-speech inference on candle with Metal acceleration"
publish = false

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
